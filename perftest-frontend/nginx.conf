# Master prompt final (Lot E) — configuration nginx minimale pour servir
# une SPA React Router : toute route inconnue de nginx (ex. /scenarios,
# /executions/detail/xxx) doit retomber sur index.html pour que React
# Router la gere cote client, jamais un 404 nginx brut sur un rechargement
# de page. DOCKER RUNTIME TEST — NOT VERIFIED (voir Dockerfile).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

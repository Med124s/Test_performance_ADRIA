# Profil "dev" : PostgreSQL et Keycloak locaux ; connexion a la base par variables d'environnement.

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/loadpilot}
    username: ${DB_USERNAME:loadpilot}
    password: ${DB_PASSWORD:}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Realm Keycloak qui emet les jetons JWT.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8081/realms/loadpilot}

# CORS : origine du frontend Vite en developpement.
app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN:http://localhost:3000}

logging:
  level:
    com.loadpilot.backend: DEBUG
    liquibase: INFO

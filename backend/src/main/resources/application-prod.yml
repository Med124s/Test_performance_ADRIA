# Profil "prod", active par SPRING_PROFILES_ACTIVE=prod. Aucune valeur par defaut : chaque variable est obligatoire.

spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: false
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${KEYCLOAK_ISSUER_URI}

# CORS : origine du frontend.
app:
  cors:
    allowed-origins:
      - ${FRONTEND_ORIGIN}

# Documentation API (Swagger) desactivee en production.
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    com.loadpilot.backend: INFO
    liquibase: INFO

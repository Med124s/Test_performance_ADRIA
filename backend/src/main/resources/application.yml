# Configuration commune a tous les profils.
# Les profils dev/test (application-dev.yml, application-test.yml) surchargent
# uniquement ce qui differe (datasource, niveaux de log...).

spring:
  application:
    name: loadpilot-backend
  profiles:
    active: dev
  jpa:
    open-in-view: false
    hibernate:
      # Schema gere par Liquibase : Hibernate verifie seulement que les entites lui correspondent.
      ddl-auto: validate
    properties:
      hibernate:
        # Insertions regroupees en lots JDBC, triees par table (order_inserts).
        jdbc:
          batch_size: 50
        order_inserts: true
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

management:
  endpoints:
    web:
      exposure:
        # Seul l'endpoint health est expose.
        include: health
  endpoint:
    health:
      # Statut global seulement ({"status":"UP"}), sans le detail des composants.
      show-details: never

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  # Version de l'application, recopiee au build depuis <version> du pom.xml (ne pas l'ecrire ici).
  version: '@project.version@'
  secrets:
    # Cle AES-256 (32 octets en Base64) qui chiffre en base les secrets des applications testees ;
    # obligatoire au demarrage (voir docs/SECRETS.md).
    encryption-key: ${LOADPILOT_SECRETS_KEY:}
  availability:
    # Timeout (secondes) du test de connectivite d'une application.
    timeout-seconds: ${AVAILABILITY_TIMEOUT_SECONDS:5}
  execution:
    # Timeout (secondes) d'une requete HTTP pendant une execution.
    timeout-seconds: ${EXECUTION_TIMEOUT_SECONDS:10}
    # Plafonds du serveur : utilisateurs virtuels d'une execution et de toutes les executions actives
    # (toujours par test <= au total).
    max-virtual-users-per-execution: ${LOADPILOT_MAX_VUS_PER_EXECUTION:200}
    max-global-virtual-users: ${LOADPILOT_MAX_GLOBAL_VUS:500}
    # Plafonds des nouvelles limites de charge (limites applicatives reglables en dessous, dans Parametres).
    max-duration-seconds: ${LOADPILOT_MAX_DURATION_SECONDS:3600}
    max-iterations: ${LOADPILOT_MAX_ITERATIONS:10000}
    max-target-rps: ${LOADPILOT_MAX_TARGET_RPS:500}
    # Au-dela de ce nombre d'utilisateurs virtuels sans debit cible : avertissement (jamais un refus)
    # a l'enregistrement du scenario et dans l'assistant. 0 = jamais d'avertissement.
    target-rps-advised-above-virtual-users: ${LOADPILOT_TARGET_RPS_ADVISED_ABOVE_VUS:50}
    # Limite du nombre d'executions QUEUED/RUNNING simultanees.
    max-concurrent-executions: ${LOADPILOT_MAX_CONCURRENT_EXECUTIONS:10}
    # Une execution restee en pause plus longtemps est annulee automatiquement.
    max-pause-minutes: ${LOADPILOT_MAX_PAUSE_MINUTES:15}
    # Garde-fou memoire (voir ResultsMemoryGuard) : nombre de resultats gardes en memoire, toutes
    # executions confondues, avant l'arret automatique de la plus grosse. 0 = calcule sur la memoire
    # de la JVM (-Xmx / 2,5 Ko : ~1,6 M avec 4 Go).
    max-results-in-memory: ${LOADPILOT_MAX_RESULTS_IN_MEMORY:0}
    # Detail des requetes (echecs + echantillon) : plafond memoire par execution. Au-dela,
    # l'echantillon des requetes reussies s'arrete ; les echecs continuent d'etre enregistres.
    request-detail:
      max-memory-mb: ${LOADPILOT_REQUEST_DETAIL_MAX_MEMORY_MB:50}
  # LoadPilot lui-meme pendant un test (voir InjectorMonitor) : au-dela de ce CPU du processus (% de la
  # machine), le suivi en direct signale un injecteur sature (temps de reponse possiblement faux).
  injector:
    cpu-warning-percent: ${LOADPILOT_INJECTOR_CPU_WARNING_PERCENT:85}
  keycloak:
    admin:
      # Compte de service Keycloak qui administre les utilisateurs et les roles.
      server-url: ${KEYCLOAK_ADMIN_SERVER_URL:http://localhost:8081}
      realm: ${KEYCLOAK_ADMIN_REALM:loadpilot}
      client-id: ${KEYCLOAK_ADMIN_CLIENT_ID:loadpilot-backend-admin}
      client-secret: ${KEYCLOAK_ADMIN_CLIENT_SECRET:}
      timeout-seconds: ${KEYCLOAK_ADMIN_TIMEOUT_SECONDS:5}
      # Liens des e-mails Keycloak (reinitialisation du mot de passe,
      # invitation d'un nouvel utilisateur) : client public et adresse de
      # l'application ouverte une fois l'action terminee.
      actions-client-id: ${KEYCLOAK_ACTIONS_CLIENT_ID:loadpilot-frontend}
      actions-redirect-uri: ${KEYCLOAK_ACTIONS_REDIRECT_URI:http://localhost:3000/}
      actions-lifespan-seconds: ${KEYCLOAK_ACTIONS_LIFESPAN_SECONDS:43200}
  audit:
    # Reverse proxies de confiance (IP separees par des virgules) : seulement
    # pour eux, l'IP reelle du client est lue dans X-Forwarded-For.
    trusted-proxies: ${LOADPILOT_AUDIT_TRUSTED_PROXIES:}
    # Purge quotidienne des entrees plus anciennes que la duree de conservation (Parametres).
    purge-cron: ${LOADPILOT_AUDIT_PURGE_CRON:0 30 3 * * *}
    # Tests locaux uniquement : duree de conservation utilisee par la purge a la place de celle de
    # Parametres (ex. 10m, 2h, 3d ; unite obligatoire). Vide = Parametres. Refuse en profil "prod".
    retention-override: ${LOADPILOT_AUDIT_RETENTION_OVERRIDE:}
    security-events:
      # Import periodique des evenements de connexion du systeme d'authentification
      # (connexion, echec, blocage, deconnexion, mot de passe) vers le journal.
      enabled: ${LOADPILOT_AUDIT_SECURITY_EVENTS_ENABLED:true}
      poll-ms: ${LOADPILOT_AUDIT_SECURITY_EVENTS_POLL_MS:60000}
  mail:
    # Serveur e-mail de LoadPilot (notifications, e-mail de test) ; Mailpit en developpement (http://localhost:8025).
    enabled: ${LOADPILOT_MAIL_ENABLED:true}
    host: ${LOADPILOT_MAIL_HOST:localhost}
    port: ${LOADPILOT_MAIL_PORT:1025}
    from: ${LOADPILOT_MAIL_FROM:no-reply@loadpilot.local}
    from-name: ${LOADPILOT_MAIL_FROM_NAME:LoadPilot}
    username: ${LOADPILOT_MAIL_USERNAME:}
    password: ${LOADPILOT_MAIL_PASSWORD:}
    starttls: ${LOADPILOT_MAIL_STARTTLS:false}
    ssl: ${LOADPILOT_MAIL_SSL:false}
    # Adresse de l'interface, pour les liens des e-mails.
    app-url: ${LOADPILOT_APP_URL:http://localhost:3000}
  results:
    # Purge quotidienne du detail des executions (durees reglables dans Parametres > Systeme :
    # 90 jours pour les resultats, 30 jours pour les en-tetes / corps). "-" = desactivee.
    purge-cron: ${LOADPILOT_RESULTS_PURGE_CRON:0 45 3 * * *}
    # Tests locaux uniquement (meme principe que app.audit.retention-override) : resultats, et
    # en-tetes / corps des requetes. Vide = Parametres. Refuse en profil "prod".
    retention-override: ${LOADPILOT_RESULTS_RETENTION_OVERRIDE:}
    request-details-retention-override: ${LOADPILOT_REQUEST_DETAILS_RETENTION_OVERRIDE:}
    snapshot-backfill:
      # Au demarrage : rapport fige des executions terminees qui n'en ont pas encore.
      enabled: ${LOADPILOT_RESULTS_SNAPSHOT_BACKFILL:true}
  scheduler:
    # Intervalle (ms) de recherche des planifications a declencher.
    poll-interval-ms: ${LOADPILOT_SCHEDULER_POLL_INTERVAL_MS:5000}

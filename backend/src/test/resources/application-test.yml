# Profil "test" : base H2 en memoire, en mode PostgreSQL.

spring:
  datasource:
    url: jdbc:h2:mem:loadpilot_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml

logging:
  level:
    com.loadpilot.backend: DEBUG
    liquibase: INFO

app:
  secrets:
    # Cle de test (texte « loadpilot-test-only-not-a-secret » en Base64).
    encryption-key: bG9hZHBpbG90LXRlc3Qtb25seS1ub3QtYS1zZWNyZXQ=
  scheduler:
    # Intervalle d'une heure : les tests appellent pollAndTrigger() directement.
    poll-interval-ms: 3600000
  audit:
    # Pas d'import automatique des evenements de securite en test (aucun Keycloak) :
    # les tests appellent SecurityEventImporter.importNewEvents() directement.
    security-events:
      enabled: false
    # Purge jamais declenchee par l'horloge en test (appelee directement par les tests).
    purge-cron: "-"
  mail:
    # Aucun serveur e-mail en test (les tests d'envoi utilisent leur propre faux serveur SMTP).
    enabled: false
  results:
    # Purge et rattrapage des rapports figes appeles directement par les tests.
    purge-cron: "-"
    snapshot-backfill:
      enabled: false

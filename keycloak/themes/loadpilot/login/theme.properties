# Thème de connexion LoadPilot.
# Hérite de keycloak.v2 (Keycloak 26.x) : les pages non surchargées ici (OTP, conditions, etc.)
# gardent le rendu officiel mais passent par notre template.ftl et nos couleurs.
parent=keycloak.v2
import=common/keycloak

# PatternFly 5 reste chargé pour les pages héritées ; loadpilot.css applique l'identité LoadPilot.
stylesCommon=vendor/patternfly-v5/patternfly.min.css vendor/patternfly-v5/patternfly-addons.css
styles=css/loadpilot.css

darkMode=true
locales=fr,en

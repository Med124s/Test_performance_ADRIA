# Stack LoadPilot complète : PostgreSQL, Keycloak, Mailpit, backend et frontend.
#
# Utilisation (procedure complete : GUIDE_INSTALLATION.md, partie A) :
#   1. .env a partir de .env.example (4 valeurs obligatoires a generer)
#   2. docker compose up -d --build
#   3. creer le premier compte Super administrateur dans Keycloak
#
# Les valeurs sensibles viennent du fichier .env (voir .env.example).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-loadpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini (voir .env.example)}
      POSTGRES_DB: ${DB_NAME:-loadpilot}
    ports:
      - "5432:5432"
    volumes:
      - loadpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-loadpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start-dev --http-port=8080 --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD doit etre defini (voir .env.example)}
      # Serveur d'e-mails du realm (mot de passe oublie, etc.), lu par
      # realm-export.json a l'import (placeholders ${KC_SMTP_...}).
      # Par defaut : Mailpit ci-dessous (aucun e-mail ne sort de la machine).
      # En production : definir ces variables dans .env (voir .env.example).
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@loadpilot.local}
      KC_SMTP_FROM_NAME: ${KC_SMTP_FROM_NAME:-LoadPilot}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
      # Secret du client loadpilot-backend-admin, lu par realm-export.json a l'import (placeholder
      # ${KEYCLOAK_ADMIN_CLIENT_SECRET}) : le meme que celui du backend, rien a recopier a la main.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET doit etre defini (voir .env.example)}
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "8081:8080"
    volumes:
      # Donnees de Keycloak (base H2 du mode start-dev : utilisateurs, sessions, reglages) : conservees
      # quand le conteneur est recree. Supprimees seulement par "docker compose down -v".
      - loadpilot_keycloak_data:/opt/keycloak/data
      # Realm loadpilot (roles, clients) importe au premier demarrage ; ignore ensuite (realm existant).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Theme de connexion LoadPilot (FreeMarker, herite de keycloak.v2).
      - ./keycloak/themes/loadpilot:/opt/keycloak/themes/loadpilot:ro

  # Serveur SMTP de developpement : capture les e-mails (rien n'est delivre) et les affiche sur http://localhost:8025.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025" # interface web
      - "1025:1025" # SMTP

  # Backend Spring Boot (backend/Dockerfile).
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Noms des services sur le reseau Docker.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-loadpilot}
      DB_USERNAME: ${DB_USERNAME:-loadpilot}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini (voir .env.example)}
      # Emetteur attendu dans les jetons : l'adresse de Keycloak VUE PAR LE NAVIGATEUR (le frontend
      # obtient ses jetons sur http://localhost:8081). Les cles de signature sont lues sur le reseau
      # Docker : avec jwk-set-uri, Spring ne contacte pas l'emetteur et verifie seulement le champ iss.
      KEYCLOAK_ISSUER_URI: http://localhost:8081/realms/loadpilot
      SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWKSETURI: http://keycloak:8080/realms/loadpilot/protocol/openid-connect/certs
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      # Serveur e-mail de LoadPilot (notifications par e-mail) : Mailpit en developpement.
      LOADPILOT_MAIL_HOST: ${LOADPILOT_MAIL_HOST:-mailpit}
      LOADPILOT_MAIL_PORT: ${LOADPILOT_MAIL_PORT:-1025}
      # Secret du client loadpilot-backend-admin : le meme que celui donne a Keycloak ci-dessus.
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET doit etre defini (voir .env.example)}
      # Cle de chiffrement des secrets des applications testees (voir docs/SECRETS.md).
      LOADPILOT_SECRETS_KEY: ${LOADPILOT_SECRETS_KEY:?LOADPILOT_SECRETS_KEY doit etre definie (cle AES-256 en Base64, voir docs/SECRETS.md)}
      # Origine du frontend vue par le navigateur.
      FRONTEND_ORIGIN: http://localhost:3000
      # Application cible (voir backend/start.sh et .env.example) : toutes optionnelles, vides par
      # defaut = ignorees. Les chemins des certificats sont ceux VUS DANS LE CONTENEUR (voir le
      # volume a decommenter ci-dessous). Vide = valeur par defaut de application.yml (10 s).
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-}
      LOADPILOT_JVM_MAX_MEMORY: ${LOADPILOT_JVM_MAX_MEMORY:-}
      LOADPILOT_TLS_TRUSTSTORE_PATH: ${LOADPILOT_TLS_TRUSTSTORE_PATH:-}
      LOADPILOT_TLS_TRUSTSTORE_PASSWORD: ${LOADPILOT_TLS_TRUSTSTORE_PASSWORD:-}
      LOADPILOT_TLS_KEYSTORE_PATH: ${LOADPILOT_TLS_KEYSTORE_PATH:-}
      LOADPILOT_TLS_KEYSTORE_PASSWORD: ${LOADPILOT_TLS_KEYSTORE_PASSWORD:-}
      LOADPILOT_HTTPS_PROXY_HOST: ${LOADPILOT_HTTPS_PROXY_HOST:-}
      LOADPILOT_HTTPS_PROXY_PORT: ${LOADPILOT_HTTPS_PROXY_PORT:-}
      LOADPILOT_HTTPS_PROXY_USERNAME: ${LOADPILOT_HTTPS_PROXY_USERNAME:-}
      LOADPILOT_HTTPS_PROXY_PASSWORD: ${LOADPILOT_HTTPS_PROXY_PASSWORD:-}
      # Purges (tests locaux, voir README) : vides = valeurs de application.yml (03:30 / 03:45) et
      # durees de Parametres > Systeme. Les *_RETENTION_OVERRIDE sont refuses en profil prod.
      LOADPILOT_AUDIT_PURGE_CRON: ${LOADPILOT_AUDIT_PURGE_CRON:-}
      LOADPILOT_RESULTS_PURGE_CRON: ${LOADPILOT_RESULTS_PURGE_CRON:-}
      LOADPILOT_AUDIT_RETENTION_OVERRIDE: ${LOADPILOT_AUDIT_RETENTION_OVERRIDE:-}
      LOADPILOT_RESULTS_RETENTION_OVERRIDE: ${LOADPILOT_RESULTS_RETENTION_OVERRIDE:-}
      LOADPILOT_REQUEST_DETAILS_RETENTION_OVERRIDE: ${LOADPILOT_REQUEST_DETAILS_RETENTION_OVERRIDE:-}
      LOADPILOT_RESULTS_SNAPSHOT_BACKFILL: ${LOADPILOT_RESULTS_SNAPSHOT_BACKFILL:-}
      LOADPILOT_SCHEDULER_POLL_INTERVAL_MS: ${LOADPILOT_SCHEDULER_POLL_INTERVAL_MS:-}
      LOADPILOT_AUDIT_SECURITY_EVENTS_ENABLED: ${LOADPILOT_AUDIT_SECURITY_EVENTS_ENABLED:-}
      LOADPILOT_AUDIT_SECURITY_EVENTS_POLL_MS: ${LOADPILOT_AUDIT_SECURITY_EVENTS_POLL_MS:-}
      LOADPILOT_AUDIT_TRUSTED_PROXIES: ${LOADPILOT_AUDIT_TRUSTED_PROXIES:-}
      # Plafonds du serveur (limites de charge) et delais : vides = valeurs de application.yml.
      AVAILABILITY_TIMEOUT_SECONDS: ${AVAILABILITY_TIMEOUT_SECONDS:-}
      LOADPILOT_MAX_VUS_PER_EXECUTION: ${LOADPILOT_MAX_VUS_PER_EXECUTION:-}
      LOADPILOT_MAX_GLOBAL_VUS: ${LOADPILOT_MAX_GLOBAL_VUS:-}
      LOADPILOT_MAX_DURATION_SECONDS: ${LOADPILOT_MAX_DURATION_SECONDS:-}
      LOADPILOT_MAX_ITERATIONS: ${LOADPILOT_MAX_ITERATIONS:-}
      LOADPILOT_MAX_TARGET_RPS: ${LOADPILOT_MAX_TARGET_RPS:-}
      LOADPILOT_TARGET_RPS_ADVISED_ABOVE_VUS: ${LOADPILOT_TARGET_RPS_ADVISED_ABOVE_VUS:-}
      LOADPILOT_MAX_CONCURRENT_EXECUTIONS: ${LOADPILOT_MAX_CONCURRENT_EXECUTIONS:-}
      LOADPILOT_MAX_PAUSE_MINUTES: ${LOADPILOT_MAX_PAUSE_MINUTES:-}
      LOADPILOT_MAX_RESULTS_IN_MEMORY: ${LOADPILOT_MAX_RESULTS_IN_MEMORY:-}
      LOADPILOT_REQUEST_DETAIL_MAX_MEMORY_MB: ${LOADPILOT_REQUEST_DETAIL_MAX_MEMORY_MB:-}
      LOADPILOT_INJECTOR_CPU_WARNING_PERCENT: ${LOADPILOT_INJECTOR_CPU_WARNING_PERCENT:-}
      # E-mails de LoadPilot (hote et port ci-dessus) : vides = valeurs de application.yml.
      LOADPILOT_MAIL_ENABLED: ${LOADPILOT_MAIL_ENABLED:-}
      LOADPILOT_MAIL_FROM: ${LOADPILOT_MAIL_FROM:-}
      LOADPILOT_MAIL_FROM_NAME: ${LOADPILOT_MAIL_FROM_NAME:-}
      LOADPILOT_MAIL_USERNAME: ${LOADPILOT_MAIL_USERNAME:-}
      LOADPILOT_MAIL_PASSWORD: ${LOADPILOT_MAIL_PASSWORD:-}
      LOADPILOT_MAIL_STARTTLS: ${LOADPILOT_MAIL_STARTTLS:-}
      LOADPILOT_MAIL_SSL: ${LOADPILOT_MAIL_SSL:-}
      LOADPILOT_APP_URL: ${LOADPILOT_APP_URL:-}
      # Liens des e-mails Keycloak (reinitialisation du mot de passe, invitation).
      KEYCLOAK_ADMIN_TIMEOUT_SECONDS: ${KEYCLOAK_ADMIN_TIMEOUT_SECONDS:-}
      KEYCLOAK_ACTIONS_CLIENT_ID: ${KEYCLOAK_ACTIONS_CLIENT_ID:-}
      KEYCLOAK_ACTIONS_REDIRECT_URI: ${KEYCLOAK_ACTIONS_REDIRECT_URI:-}
      KEYCLOAK_ACTIONS_LIFESPAN_SECONDS: ${KEYCLOAK_ACTIONS_LIFESPAN_SECONDS:-}
    # Certificats de l'application cible : decommenter et placer les fichiers dans ./certs (dossier
    # ignore par Git), puis renseigner par exemple LOADPILOT_TLS_TRUSTSTORE_PATH=/opt/loadpilot/certs/truststore.p12.
    # volumes:
    #   - ./certs:/opt/loadpilot/certs:ro
    ports:
      - "8080:8080"

  # Frontend (perftest-frontend/Dockerfile) ; les URL VITE_* sont utilisees par le navigateur, donc vers les ports de l'hote.
  frontend:
    build:
      context: ./perftest-frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: loadpilot
        VITE_KEYCLOAK_CLIENT_ID: loadpilot-frontend
        VITE_SPRING_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  loadpilot_postgres_data:
  loadpilot_keycloak_data:

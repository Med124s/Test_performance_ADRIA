# Reproductibilité complète de la stack LoadPilot (PostgreSQL → Keycloak →
# Backend → Frontend). Ceci est une VOIE SUPPLÉMENTAIRE, pas un
# remplacement : les procédures manuelles documentées dans
# postgresql/README.md, keycloak/README.md et le README principal
# (`mvn spring-boot:run` / `npm run dev`) restent valides et ne sont pas
# retirées.
#
# Master prompt final (Lot E) — backend/frontend AJOUTÉS (Dockerfiles
# multi-stage réels : backend/Dockerfile, perftest-frontend/Dockerfile),
# après évaluation que l'architecture actuelle (Maven/pom.xml Java 21,
# package.json/vite build) le permet proprement sans inventer de nouvelle
# convention.
#
# IMPORTANT : la disponibilité de Docker sur la machine où ce fichier a été
# écrit N'A JAMAIS pu être vérifiée (`docker` introuvable dans tout
# l'environnement de développement de ce projet) — seules la syntaxe YAML
# et la cohérence statique (ports/variables/dépendances) ont été validées.
# DOCKER RUNTIME TEST — NOT VERIFIED (voir rapport de phase).
#
# Utilisation :
#   cp .env.example .env   # puis renseigner de vrais mots de passe locaux
#   docker compose up -d --build
#
# Aucun secret réel dans ce fichier : toutes les valeurs sensibles viennent
# de variables d'environnement (voir .env.example à la racine).

services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-loadpilot}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini (voir .env.example)}
      POSTGRES_DB: ${DB_NAME:-loadpilot}
    ports:
      - "5432:5432"
    volumes:
      - loadpilot_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-loadpilot}"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:26.7.3
    restart: unless-stopped
    command: start-dev --http-port=8080 --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD doit etre defini (voir .env.example)}
      # Serveur d'e-mails du realm (mot de passe oublie, etc.), lu par
      # realm-export.json a l'import (placeholders ${KC_SMTP_...}).
      # Par defaut : Mailpit ci-dessous (aucun e-mail ne sort de la machine).
      # En production : definir ces variables dans .env (voir .env.example).
      KC_SMTP_HOST: ${KC_SMTP_HOST:-mailpit}
      KC_SMTP_PORT: ${KC_SMTP_PORT:-1025}
      KC_SMTP_FROM: ${KC_SMTP_FROM:-no-reply@loadpilot.local}
      KC_SMTP_FROM_NAME: ${KC_SMTP_FROM_NAME:-LoadPilot}
      KC_SMTP_STARTTLS: ${KC_SMTP_STARTTLS:-false}
      KC_SMTP_SSL: ${KC_SMTP_SSL:-false}
      KC_SMTP_AUTH: ${KC_SMTP_AUTH:-false}
      KC_SMTP_USER: ${KC_SMTP_USER:-}
      KC_SMTP_PASSWORD: ${KC_SMTP_PASSWORD:-}
    depends_on:
      mailpit:
        condition: service_started
    ports:
      - "8081:8080"
    volumes:
      # Import automatique au demarrage (realm/roles/clients reels, voir
      # keycloak/README.md) - aucun utilisateur, aucun secret reel dans ce
      # fichier (secret du client confidentiel masque a l'export).
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
      # Theme de connexion LoadPilot (FreeMarker, herite de keycloak.v2) :
      # charge au demarrage ; en start-dev le cache des themes est desactive,
      # une modification des fichiers est visible au rechargement de la page.
      - ./keycloak/themes/loadpilot:/opt/keycloak/themes/loadpilot:ro

  # Serveur SMTP local de developpement / demo : capture TOUS les e-mails
  # envoyes par Keycloak (rien n'est reellement delivre) et les affiche sur
  # http://localhost:8025. Inutile en production si KC_SMTP_HOST pointe
  # vers un vrai serveur.
  mailpit:
    image: axllent/mailpit:v1.31.4
    restart: unless-stopped
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: 1
      MP_SMTP_AUTH_ALLOW_INSECURE: 1
    ports:
      - "8025:8025" # interface web
      - "1025:1025" # SMTP

  # Master prompt final (Lot E) — build reel depuis backend/Dockerfile
  # (multi-stage Maven, voir ce fichier). "keycloak: service_started"
  # uniquement (jamais "service_healthy") : ce realme Keycloak (start-dev,
  # sans son endpoint /health active) n'expose ici aucun healthcheck
  # verifie - attendre seulement son demarrage est une simplification
  # honnete, jamais une garantie qu'il repond deja reellement.
  backend:
    build:
      context: ./backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: dev
      # Noms de service Docker internes (reseau compose), jamais
      # "localhost" - le backend tourne DANS un conteneur distinct de
      # postgres/keycloak, "localhost" y designerait le conteneur backend
      # lui-meme.
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-loadpilot}
      DB_USERNAME: ${DB_USERNAME:-loadpilot}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD doit etre defini (voir .env.example)}
      KEYCLOAK_ISSUER_URI: http://keycloak:8080/realms/loadpilot
      KEYCLOAK_ADMIN_SERVER_URL: http://keycloak:8080
      # Serveur e-mail de LoadPilot (notifications par e-mail) : Mailpit en developpement.
      LOADPILOT_MAIL_HOST: ${LOADPILOT_MAIL_HOST:-mailpit}
      LOADPILOT_MAIL_PORT: ${LOADPILOT_MAIL_PORT:-1025}
      # Genere par Keycloak a l'import du realm (jamais une valeur connue a
      # l'avance) - voir keycloak/README.md, section "Apres l'import".
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET doit etre recupere dans la Console Admin Keycloak apres import (voir keycloak/README.md)}
      # Cle de chiffrement des secrets des applications testees (voir docs/SECRETS.md).
      LOADPILOT_SECRETS_KEY: ${LOADPILOT_SECRETS_KEY:?LOADPILOT_SECRETS_KEY doit etre definie (cle AES-256 en Base64, voir docs/SECRETS.md)}
      # Origine du NAVIGATEUR (cote hote, voir frontend ci-dessous) - jamais
      # un nom de service Docker interne.
      FRONTEND_ORIGIN: http://localhost:3000
      # Application cible (voir backend/start.sh et .env.example) : toutes optionnelles, vides par
      # defaut = ignorees. Les chemins des certificats sont ceux VUS DANS LE CONTENEUR (voir le
      # volume a decommenter ci-dessous). Vide = valeur par defaut de application.yml (10 s).
      EXECUTION_TIMEOUT_SECONDS: ${EXECUTION_TIMEOUT_SECONDS:-}
      LOADPILOT_JVM_MAX_MEMORY: ${LOADPILOT_JVM_MAX_MEMORY:-}
      LOADPILOT_TLS_TRUSTSTORE_PATH: ${LOADPILOT_TLS_TRUSTSTORE_PATH:-}
      LOADPILOT_TLS_TRUSTSTORE_PASSWORD: ${LOADPILOT_TLS_TRUSTSTORE_PASSWORD:-}
      LOADPILOT_TLS_KEYSTORE_PATH: ${LOADPILOT_TLS_KEYSTORE_PATH:-}
      LOADPILOT_TLS_KEYSTORE_PASSWORD: ${LOADPILOT_TLS_KEYSTORE_PASSWORD:-}
      LOADPILOT_HTTPS_PROXY_HOST: ${LOADPILOT_HTTPS_PROXY_HOST:-}
      LOADPILOT_HTTPS_PROXY_PORT: ${LOADPILOT_HTTPS_PROXY_PORT:-}
      LOADPILOT_HTTPS_PROXY_USERNAME: ${LOADPILOT_HTTPS_PROXY_USERNAME:-}
      LOADPILOT_HTTPS_PROXY_PASSWORD: ${LOADPILOT_HTTPS_PROXY_PASSWORD:-}
      # Purges (tests locaux, voir README) : vides = valeurs de application.yml (03:30 / 03:45) et
      # durees de Parametres > Systeme. Les *_RETENTION_OVERRIDE sont refuses en profil prod.
      LOADPILOT_AUDIT_PURGE_CRON: ${LOADPILOT_AUDIT_PURGE_CRON:-}
      LOADPILOT_RESULTS_PURGE_CRON: ${LOADPILOT_RESULTS_PURGE_CRON:-}
      LOADPILOT_AUDIT_RETENTION_OVERRIDE: ${LOADPILOT_AUDIT_RETENTION_OVERRIDE:-}
      LOADPILOT_RESULTS_RETENTION_OVERRIDE: ${LOADPILOT_RESULTS_RETENTION_OVERRIDE:-}
      LOADPILOT_REQUEST_DETAILS_RETENTION_OVERRIDE: ${LOADPILOT_REQUEST_DETAILS_RETENTION_OVERRIDE:-}
    # Certificats de l'application cible : decommenter et placer les fichiers dans ./certs (dossier
    # ignore par Git), puis renseigner par exemple LOADPILOT_TLS_TRUSTSTORE_PATH=/opt/loadpilot/certs/truststore.p12.
    # volumes:
    #   - ./certs:/opt/loadpilot/certs:ro
    ports:
      - "8080:8080"

  # Master prompt final (Lot E) — build reel depuis
  # perftest-frontend/Dockerfile (multi-stage Node+nginx). Les URLs
  # VITE_* sont des ARGS DE BUILD (voir Dockerfile) resolues par le
  # NAVIGATEUR de l'utilisateur : elles pointent donc vers les ports
  # EXPOSES A L'HOTE (localhost:8081/8080 ci-dessus), jamais vers les noms
  # de service internes "keycloak"/"backend" que le navigateur ne peut pas
  # resoudre.
  frontend:
    build:
      context: ./perftest-frontend
      args:
        VITE_KEYCLOAK_URL: http://localhost:8081
        VITE_KEYCLOAK_REALM: loadpilot
        VITE_KEYCLOAK_CLIENT_ID: loadpilot-frontend
        VITE_SPRING_API_URL: http://localhost:8080
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "3000:80"

volumes:
  loadpilot_postgres_data:
